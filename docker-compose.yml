version: '3.8'

services:
  # SSE 服务 (端口 18080)
  mcp-server-sse:
    build: .
    container_name: google-patents-mcp-sse
    ports:
      - "18080:18080"
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
    command: ["python", "start_mcp_server.py", "--transport", "sse", "--host", "0.0.0.0", "--port", "18080"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18080/sse"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # WebSocket 服务 (端口 28080)
  mcp-server-websocket:
    build: .
    container_name: google-patents-mcp-websocket
    ports:
      - "28080:28080"
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
    command: ["python", "start_mcp_server.py", "--transport", "websocket", "--host", "0.0.0.0", "--port", "28080"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:28080/ws"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  default:
    name: google-patents-mcp-network